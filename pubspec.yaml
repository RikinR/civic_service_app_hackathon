  assets:
    - assets/govt_logo.png
    - assets/mini_schemes/IMG-20250915-WA0084.jpg
    - assets/mini_schemes/IMG-20250915-WA0085.jpg
    - assets/mini_schemes/IMG-20250915-WA0086.jpg
    - assets/mini_schemes/IMG-20250915-WA0087.jpg
    - assets/mini_schemes/IMG-20250915-WA0088.jpg
    - assets/mini_schemes/IMG-20250915-WA0089.jpg
    - assets/schemes/IMG-20250915-WA0090.jpg
    - assets/schemes/IMG-20250915-WA0091.jpg
    - assets/schemes/IMG-20250915-WA0092.jpg
    - assets/schemes/IMG-20250915-WA0093.jpg
    - assets/mini_schemes/IMG-20250916-WA0005.jpg
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_logo.png
  android: true
  ios: true
  web: false
